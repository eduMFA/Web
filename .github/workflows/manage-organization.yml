name: Add Organization to eduMFA

on:
  issues:
    types: [opened, edited]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  open-pull-request:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'organization') &&
      (github.event.action == 'opened' || github.event.changes.body != null)
    concurrency:
      group: manage-organization-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate submission and update data
        id: update_data
        uses: actions/github-script@v9
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/create_organization_pr.js`);
            core.setOutput('valid', String(await script({github, context, core})));

      - name: Create or update pull request
        if: steps.update_data.outputs.valid == 'true'
        id: pull_request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            public/organizations
            src/data/users.json
          commit-message: "Update organization listing"
          branch: ${{ steps.update_data.outputs.branch }}
          delete-branch: true
          title: "[Org] Add ${{ steps.update_data.outputs.name }}"
          body: |
            This PR adds or updates the organization described in the linked issue.
            > [!NOTE]
            > This is an automated action.

            Closes #${{ github.event.issue.number }}
          labels: organization
          reviewers: luc1412

      - name: Comment on issue
        if: steps.pull_request.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Thank you for your submission! A pull request has been created for review. To correct your submission, edit the fields in the body of this issue and save it. The pull request will update once the changes pass validation."
